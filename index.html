<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trailer supplies request</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14181a">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f1f0ea;--sf:#fff;--ink:#1b1f1d;--mut:#5d6762;--ac:#e0a100;--acink:#1b1f1d;--line:#d6d4c8;--bad:#b3261e;--ok:#1f6b45;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181a;--sf:#1e2427;--ink:#eceee9;--mut:#97a29c;--line:#323b3f;--bad:#ff8a80;--ok:#6fd3a0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181a;--sf:#1e2427;--ink:#eceee9;--mut:#97a29c;--line:#323b3f;--bad:#ff8a80;--ok:#6fd3a0;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
.w{max-width:680px;margin:0 auto;padding:0 14px}
header{padding:10px 0 8px;display:flex;align-items:center;gap:10px}
h1{font-size:1.1rem;line-height:1.15;margin:0;letter-spacing:-.01em;flex:1}
h2{font-size:1rem;margin:22px 0 8px}
#st{font-size:.8rem;font-weight:600;padding:5px 10px;border-radius:99px;border:1.5px solid var(--ok);color:var(--ok);white-space:nowrap}
#st.off{border-color:var(--bad);color:var(--bad)}
#sbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}#sbar span{padding:5px 10px;border-radius:99px;font-size:.8rem;font-weight:600;white-space:nowrap}
#sv,#ls{border:1.5px solid var(--line)}#sv{color:var(--mut)}#ls.ok{border-color:var(--ok)}#ls.wait{background:var(--ac);color:var(--acink);border-color:var(--ac)}
#brand{background:#fff;border-radius:8px;padding:4px 7px;flex:none}#brand img{display:block;height:46px;width:auto}
#cneed,#rjb{border:2px solid var(--ac);background:var(--sf);padding:10px 12px;border-radius:8px;margin:0 0 10px;display:grid;gap:8px}
#proto{margin:28px 0 8px;color:var(--mut);font-size:.85rem}
#clr{padding:8px 12px;font-size:.85rem;white-space:nowrap}
#chk{border:2px solid var(--ac);background:var(--sf);padding:10px 12px;border-radius:8px;margin:0 0 10px}
#kept{border:2px solid var(--ac);background:var(--sf);padding:10px 12px;border-radius:8px;margin:0 0 10px}
label.chk{flex-direction:row;align-items:center;align-self:end;min-height:44px;gap:10px;color:var(--ink);font-size:.95rem;font-weight:600}label.chk input{width:22px;height:22px}
.g{display:grid;gap:10px;grid-template-columns:1fr 1fr}
label{display:flex;flex-direction:column;font-size:.82rem;color:var(--mut);gap:3px}
label.full{grid-column:1/-1}
input,textarea{font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--line);border-radius:8px;padding:10px;width:100%}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
input:disabled{background:var(--bg);color:var(--mut)}
input[readonly]{background:var(--bg);color:var(--mut)}
input.bad{border-color:var(--bad)}
#chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.chip{flex:none;font:inherit;font-size:.85rem;border:1.5px solid var(--line);background:var(--sf);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.it{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--sf);border:1.5px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.it.on{border-color:var(--ac);border-left-width:6px}
.it img{width:56px;height:56px;border-radius:8px;display:block}
.nm b{display:block;font-weight:600;line-height:1.2}.nm small{display:block;color:var(--mut);font-size:.8rem;margin-top:2px}
.st{display:flex;align-items:center;gap:4px}
.st button,.tool{font:inherit;font-size:1.3rem;width:42px;height:42px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.st button:active{background:var(--ac);color:var(--acink)}
output{min-width:30px;text-align:center;font-weight:700;font-size:1.05rem}
output.max{color:var(--bad)}
.empty{color:var(--mut);padding:18px 4px}
.rl{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rl span:last-child{font-weight:700}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1.5px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
#bar .w{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0}
#bar .w>span:last-child{display:flex;gap:8px;white-space:nowrap}
.btn{font:inherit;font-weight:700;background:var(--ac);color:var(--acink);border:0;border-radius:10px;padding:12px 20px;cursor:pointer}
.btn.alt{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
#up{position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--sf);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#msg{margin:12px 0;padding:12px;border-radius:8px;background:var(--sf);border:1.5px solid var(--ok);display:none}
#msg.err{border-color:var(--bad)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="w">
<header><div id="brand"><img id="logo" alt="Boreal E-line Pump Down" width="60" height="46"></div><h1>Trailer supplies request</h1><button class="btn alt" id="clr">Clear form</button></header>
<div id="sbar"><span id="st" role="status">Online</span><span id="sv"></span><span id="ls" role="status"></span></div>
<div id="cneed" role="alert" hidden><strong>Access code needed to send your waiting request.</strong><label>Access code<input id="code2" type="password" autocomplete="off" autocapitalize="off" autocorrect="off"></label><p id="cmsg2" style="color:var(--bad);font-weight:600;margin:0" hidden></p><button type="button" class="btn" id="csend">Enter code and send</button></div>
<div id="rjb" role="alert" hidden><strong id="rjt"></strong><p id="rjm" style="margin:0"></p><span><button type="button" class="btn" id="rjfix">Fix request</button> <button type="button" class="btn alt" id="rjtry">Try again</button></span></div>
<div id="rvb" role="status" hidden style="border:2px solid var(--ac);background:var(--sf);padding:10px 12px;border-radius:8px;margin:0 0 10px"></div>
<div id="msg" role="alert"></div>
<form id="hdr" class="g" onsubmit="return false"></form>
<label style="margin-top:10px">Additional items (not on the list)
<textarea id="x" rows="3" placeholder="Item, quantity, and why"></textarea></label>

<section id="pick">
<h2>Items</h2>
<input id="s" type="search" placeholder="Search by name or part number" aria-label="Search items" autocomplete="off">
<div id="chips"></div>
<div id="list"></div>
</section>

<section id="rev" hidden>
<h2>Review your request</h2>
<p id="chk"><strong>Please make sure all information is correct before submitting.</strong></p>
<div id="sum"></div>
<div id="rl"></div>
<label id="cbox" style="margin-top:14px" hidden>Access code (asked once on this phone)<input id="code" type="password" autocomplete="off" autocapitalize="off" autocorrect="off"></label>
<p id="cmsg" style="color:var(--bad);font-weight:600;margin:6px 0 0" hidden></p>
<button type="button" class="chip" id="fc" style="margin-top:14px" hidden>Forget access code on this phone</button>
</section>
</div>

<div id="bar"><div class="w">
<span id="cnt"></span>
<span><button class="btn alt" id="back" hidden>Back</button> <button class="btn" id="go">Review request</button></span>
</div></div>

rowOf([[170,235,"Date","date",26],[380,456,"Trailer #","trailer",21]]);
